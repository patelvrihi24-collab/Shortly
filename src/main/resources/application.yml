app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}  # signing key
    expiration-minutes: 60
  #short link we return (http://localhost:8080/abc) needs a base address.
  #Hardcoding it in Java would break when you deploy.
  #Putting it in config lets production override it with an environment variable.
spring:
  application:
    name: shortly
  datasource:
    url: jdbc:postgresql://localhost:5432/shortly
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379